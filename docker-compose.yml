services:
  postgres:
    image: postgres:16-alpine
    container_name: franchise-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-franchise_db}
      POSTGRES_USER: ${DATABASE_USERNAME:-franchise_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-franchise_pass}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - franchise_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-franchise_user} -d ${DATABASE_NAME:-franchise_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: franchise-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-franchise_db}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-franchise_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-franchise_pass}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  franchise_pg_data:
